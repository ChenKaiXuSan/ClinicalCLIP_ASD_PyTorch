# hydra config
hydra:
  run:
    dir: ${log_path}
  sweep:
    dir: ${log_path}
    subdir: ${train.experiment}/${train.clip_duration}_${train.uniform_temporal_subsample_num}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

loss:
  lr: 0.01
  weight_decay: 0.001
  clip_weight: 1.0
  clip_temperature: 0.07

  # concept 架构:分类 + 区域存在性 + 空间 grounding + 概念对比
  presence_weight: 1.0
  grounding_weight: 1.0
  concept_weight: 0.1

paths:
  root_path: /workspace/data

  video_path: ${paths.root_path}/segmentation_dataset_512

  info_path: ${paths.root_path}/clinical_CLIP_dataset

  data_info_path: "${paths.info_path}/json_mix"
  doctor_results_path: "${paths.info_path}/doctor_result"
  skeleton_path: "${paths.info_path}/seg_skeleton_pkl"
  index_mapping: "${paths.info_path}/index_mapping"

data:
  num_workers: 12
  img_size: 224

  batch_size: 1 # batch size per GPU

model:
  backbone: "clip"
  model: "resnet" # model architecture name
  model_class_num: 3 # number of classes: 2 (ASD vs non-ASD), 3 (ASD, DHS, LCS_HipOA), etc.
  clip_backbone_depth: 50 # ResNet depth for 3D CNN
  clip_backbone_pretrained: true
  attn_backbone_pretrained: false

  clip_feature_dim: 512
  clip_embed_dim: 256
  clip_classifier_source: "video" # video | attn | fusion 在分类头之前的特征来源
  clip_init_temperature: 0.07
  attn_in_channels: 1

  map_guided: true
  map_guided_type: "spatiotemporal" # spatiotemporal | channel | weighted_pool
  map_guided_hidden_dim: 64
  map_guided_alpha: 1.0
  map_guided_sigmoid_gate: false
  lambda_token: 0.0

  # ---- clinical concept grounding (backbone=concept) ----
  concept_embed_dim: 256
  concept_temperature: 0.07
  # 外部预计算的文本概念向量 (R x dim, 顺序同 REGIONS)，留空则用可学习概念
  concept_text_embedding: null
  concept_freeze_text: true
  region_map_size: 28 # grounding 目标图的空间分辨率
  shuffle_region: false # 消融: 打乱区域标注, 检验增益是否来自临床知识

train:
  # Training config
  max_epochs: 100

  # used for val
  clip_duration: 1 # clip duration for the video
  uniform_temporal_subsample_num: 8 # num frame from the clip duration, f or define one gait cycle, we need use whole frames.

  attn_map: True # if use the attention map

  experiment: ${oc.select:hydra.runtime.choices.experiment,manual} # fallback for direct CLI overrides

  gpu_num: 0 # GPU device number

  fold: 10 # the fold number of the cross validation

  # 只训练指定折(如 [0]),留空跑全部。注意 index_mapping 缓存一旦存在,
  # fold 数就以缓存为准,改这里不会重新划分
  folds: null

  fast_dev_run: false # 只跑一个 batch,验证整条链路

log_path: logs/train/${train.experiment}/${now:%Y-%m-%d}/${now:%H-%M-%S}
