# hydra config
hydra:
  run:
    dir: ${log_path}
  sweep:
    dir: ${log_path}
    subdir: ${train.experiment}/${train.clip_duration}_${train.uniform_temporal_subsample_num}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

loss:
  # 1e-2 会让 Adam 冲垮 Kinetics 预训练的 backbone:实测分类损失在 80 步内
  # 从 1.20 掉到 0.02 又崩到 5.52,训练全程停在类别先验上。1e-3 仍震荡,
  # 1e-4 单调稳定收敛。
  lr: 0.0001
  weight_decay: 0.001
  clip_weight: 1.0
  clip_temperature: 0.07

  # concept 架构:分类 + 区域存在性 + 空间 grounding + 概念对比
  presence_weight: 1.0
  grounding_weight: 1.0
  concept_weight: 0.1
  # 角色二(VLM 教师):视频分支额外回归 VLM 给出的临床属性分数(z 标准化, MSE)。
  # 0 = 不用;需要 data.aux_targets_dir。推理时不需要 VLM
  aux_weight: 0.0

paths:
  root_path: /workspace/data

  video_path: ${paths.root_path}/segmentation_dataset_512

  info_path: ${paths.root_path}/clinical_CLIP_dataset

  data_info_path: "${paths.info_path}/json_mix"
  doctor_results_path: "${paths.info_path}/doctor_result"
  skeleton_path: "${paths.info_path}/seg_skeleton_pkl"
  index_mapping: "${paths.info_path}/index_mapping"

data:
  num_workers: 12
  img_size: 224

  batch_size: 1 # batch size per GPU

  # 离线 VLM 特征缓存目录(<dir>/<video_name>.pt),由 scripts/extract_vlm_features.py 生成。
  # 非空时 dataset 不解码像素、直接返回 tokens,训练从小时级降到分钟级。
  # 必须与 model.vlm_backend / vlm_name / vlm_img_size / uniform_temporal_subsample_num 一致。
  feature_cache_dir: null

  # 角色二:VLM 属性分数目录(analysis/eval_qwen_attributes.py 的 --out-dir, 每属性一个 json)。
  # 非空时 batch 带 aux (B, A),配合 loss.aux_weight>0 训练辅助回归头
  aux_targets_dir: null

model:
  backbone: "clip"
  model: "resnet" # 仅 3dcnn/2dcnn/cnn_lstm 基线经 make_model 使用
  model_depth: 50 # 基线 backbone 深度 (make_model 需要)
  model_class_num: 2 # ASD vs non-ASD。三分类已放弃,原因见 docs/why_binary.md
  clip_backbone_depth: 50 # ResNet depth for 3D CNN
  clip_backbone_pretrained: true
  attn_backbone_pretrained: false

  clip_feature_dim: 512
  clip_embed_dim: 256
  clip_classifier_source: "video" # video | attn | fusion 在分类头之前的特征来源
  clip_init_temperature: 0.07
  attn_in_channels: 1

  map_guided: true
  map_guided_type: "spatiotemporal" # spatiotemporal | channel | weighted_pool
  # token 投影维度。map_guided 分支是 conv1x1(2048 -> 这个数) -> 门控 -> 池化 ->
  # fc(-> clip_feature_dim),而 map_guided=false 分支是池化 -> fc(2048 -> clip_feature_dim)。
  # 原来这里是 64,等于给"有 map guidance"那条臂加了个 32 倍的瓶颈,消融里两条臂
  # 比的就不只是 guidance 本身,还有容量差。取 512 与另一条臂对齐。
  # 要复现旧行为就覆盖 model.map_guided_hidden_dim=64。
  map_guided_hidden_dim: 512
  map_guided_alpha: 1.0
  map_guided_sigmoid_gate: false
  lambda_token: 0.0

  # ---- clinical concept grounding (backbone=concept) ----
  concept_embed_dim: 256
  concept_temperature: 0.07
  # 外部预计算的文本概念向量 (R x dim, 顺序同 REGIONS)，留空则用可学习概念
  concept_text_embedding: null
  concept_freeze_text: true
  region_map_size: 28 # grounding 目标图的空间分辨率
  # 分类头的全局通路是否绕开 token_proj 的 2048 -> concept_embed_dim 瓶颈。
  # false(默认, 既有行为): 全局特征也取投影后的 256 维, 与概念通路共用同一个
  # 被 grounding 塑形的瓶颈 —— "先验只是引导, 不该成为唯一通路"其实没做到。
  # true: 取投影前的 2048 维, 与 B0_3dcnn 的分类输入同宽。
  concept_global_from_raw: false
  # grounding 是否只约束空间维。医生区域图逐帧质量的变异系数只有 0.043(时间上
  # 几乎均匀),联合 softmax 等于强制"每帧同等重要",没有临床依据。true 时池化
  # 不变,只把交给 grounding 的那份的时间边缘换成均匀。
  concept_spatial_softmax: false
  # 是否加一个不受 grounding 约束的背景概念槽位,给区域外的判别证据一个去处。
  concept_background: false
  shuffle_region: false # 消融: 打乱区域标注, 检验增益是否来自临床知识
  # 对照: 把 grounding 的空间目标随机平移到解剖上错误的位置(形状/集中度/时间剖面
  # 全部保持不变)。回答"剩下的分类代价是医生区域特有的, 还是任何空间约束都有"。
  random_region_map: false
  # both | doctor1 | doctor2。两位医生仅 45.7% 一致, 用来检验软标签设计是否
  # 真的优于只用单个标注者
  doctor_source: "both"

  # ---- pose-only baseline (backbone=pose) ----
  pose_hidden_dim: 64

  # ---- VLM token 编码器 (concept 架构的 backbone 可选项, 以及 backbone=vlm_probe) ----
  # resnet3d: slow_r50(既有行为) | vlm: 冻结的 VLM 视觉塔,见 models/vlm_encoder.py
  token_backbone: "resnet3d"
  vlm_backend: "siglip2" # siglip2 | internvideo2
  vlm_name: "google/siglip2-so400m-patch16-384" # HF 模型名,或 internvideo2 的本地权重路径
  # 送入视觉塔的边长;空则用模型原生尺寸。dataset 输出 data.img_size,编码器内部再缩放
  vlm_img_size: null
  # 0 = 全部冻结(V0/V1);N>0 = 只解冻最后 N 个 block(V3)
  vlm_trainable_blocks: 0
  # 冻结前向的分块帧数,控制显存(一条视频最多 28 段 x 8 帧)
  vlm_forward_chunk: 64
  # vlm_probe:token 池化方式 mean | attn(可学习 query 的注意力池化)| pooled(qwen3vl 回答位置的隐状态)
  probe_pool: "mean"
  # ---- qwen3vl 后端(生成式 VLM)----
  # 指令预设名(models/vlm_prompts.py:generic / clinical / region_<r>)或原文。指令在视频之前,
  # 视频 token 的隐状态被它调制 —— 医生关注区域以文本形式进入。必须是患者无关的
  vlm_prompt: "generic"
  # 取语言模型第几层的隐状态作为 token,-1 = 末层
  vlm_layer: -1

train:
  # Training config
  max_epochs: 100

  # used for val
  clip_duration: 1 # clip duration for the video
  uniform_temporal_subsample_num: 8 # num frame from the clip duration, f or define one gait cycle, we need use whole frames.

  attn_map: True # if use the attention map

  transfer_learning: true # 基线是否用 Kinetics 预训练权重 (make_model 需要)

  experiment: ${oc.select:hydra.runtime.choices.experiment,manual} # fallback for direct CLI overrides

  gpu_num: 0 # GPU device number

  fold: 5 # the fold number of the cross validation

  # 只训练指定折(如 [0]),留空跑全部。注意 index_mapping 缓存一旦存在,
  # fold 数就以缓存为准,改这里不会重新划分
  folds: null

  seed: 42 # 报告方差时需要跑多个种子

  fast_dev_run: false # 只跑一个 batch,验证整条链路

  # 32-true | bf16-mixed。显存峰值随视频最长段数变化(838 帧的视频约 31GB),
  # 跑全矩阵时用 bf16-mixed 可显著降低显存与耗时
  precision: "32-true"

log_path: logs/train/${train.experiment}/${now:%Y-%m-%d}/${now:%H-%M-%S}
